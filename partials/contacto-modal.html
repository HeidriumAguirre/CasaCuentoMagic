<div class="contacto-modal" id="contactoModal" role="dialog" aria-modal="true" aria-labelledby="contactoModalTitle">
  <div class="contacto-modal-content">
    <button class="contacto-modal-close" id="contactoModalClose" aria-label="Cerrar">✕</button>
    <h3 class="contacto-modal-title" id="contactoModalTitle">Contáctanos</h3>
    <p class="contacto-modal-subtitle">Envíanos un mensaje y te responderemos a la brevedad.</p>
    <form id="contactoForm" class="contacto-form" novalidate>
      <div class="form-group">
        <label for="contacto-nombre">Nombre *</label>
        <input type="text" name="nombre" id="contacto-nombre" required placeholder="Tu nombre completo" />
      </div>
      <div class="form-group">
        <label for="contacto-asunto">Asunto *</label>
        <input type="text" name="asunto" id="contacto-asunto" required placeholder="Motivo de tu consulta" />
      </div>
      <div class="form-group">
        <label for="contacto-correo">Correo *</label>
        <input type="email" name="correo" id="contacto-correo" required placeholder="tu@email.com" />
      </div>
      <div class="form-group">
        <label for="contacto-mensaje">Mensaje *</label>
        <textarea name="mensaje" id="contacto-mensaje" rows="5" required placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
      </div>
      <button type="submit" class="contacto-modal-btn">Enviar Mensaje</button>
      <p class="contacto-modal-note" id="contactoModalNote" style="display:none;"></p>
    </form>
  </div>
</div>
